# The site now lives in website/public, and GitHub Pages can only serve "/" or
# "/docs" from a branch. This workflow publishes website/public instead, so the
# klientohq.github.io URL keeps working after the folder reorganisation.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build and verify
        run: npm run gate
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/public
      - id: deployment
        uses: actions/deploy-pages@v4
