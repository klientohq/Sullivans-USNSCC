    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <meta name="description" content="{{ description }}" />
    <link rel="canonical" href="{{ canonical }}" />
    {{#if noindex}}<meta name="robots" content="noindex, follow" />{{/if}}

    <meta property="og:type" content="{{ ogType }}" />
    <meta property="og:site_name" content="{{ site.fullName }}" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="{{ ogTitle }}" />
    <meta property="og:description" content="{{ ogDescription }}" />
    <meta property="og:url" content="{{ canonical }}" />
    <meta property="og:image" content="{{ ogImage }}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{ ogImageAlt }}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{ ogTitle }}" />
    <meta name="twitter:description" content="{{ ogDescription }}" />
    <meta name="twitter:image" content="{{ ogImage }}" />
    <meta name="twitter:image:alt" content="{{ ogImageAlt }}" />

    <meta name="theme-color" content="#071326" />
    <link rel="icon" href="./assets/images/logo.webp" type="image/webp" />
    <link rel="apple-touch-icon" href="./assets/images/logo.webp" />

    <!-- No cross-origin preconnect here, deliberately. This used to preconnect to
         klientohq.github.io on every page of every host. On GitHub Pages that is
         same-origin and redundant; on Cloudflare it opened a DNS + TCP + TLS
         handshake to GitHub on arrival, for nothing, and handed GitHub the
         visitor's IP before they had clicked anything. privacy.html says the map
         is the only third party a page reaches, and the map is click-to-load
         (ADR-022), so the code has to match the claim. Every asset this site
         needs is same-origin. -->
    <!-- Both families, not just the text one. Libre Franklin sets every h1, so
         discovering it only after the stylesheet parses reflowed the masthead
         when it swapped in: measured CLS 0.059 on About at 412px. -->
    {{#each site.preloadFonts}}<link rel="preload" href="./assets/fonts/{{ file }}" as="font" type="font/woff2" crossorigin />
    {{/each}}
    <link rel="stylesheet" href="./styles.css?v={{ site.assetVersion }}" />
    <script type="application/ld+json">{{{ jsonld }}}</script>
